<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Titan Club</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@400;600;700&display=swap">
<style>
:root{--navy:#0D1B45;--deep:#08122F;--royal:#2552B0;--sky:#4AA3E3;--pale:#EAF2FD;--white:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*{box-sizing:border-box;margin:0}
body{min-height:100%;background:var(--navy);color:var(--white);font-family:"Readex Pro",Tahoma,"Segoe UI",sans-serif;overflow-x:hidden;position:relative}
body::before{content:"";position:fixed;inset:0;z-index:0;background:radial-gradient(90% 55% at 50% 0%,#2552B0 0%,rgba(37,82,176,0) 70%),radial-gradient(70% 40% at 100% 100%,rgba(74,163,227,.35),transparent 70%),linear-gradient(180deg,var(--navy),var(--deep))}
.bg{position:fixed;left:0;right:0;bottom:0;width:100%;height:55%;z-index:0;pointer-events:none}
.bg .bar{transform-box:fill-box;transform-origin:bottom;animation:grow 1.1s cubic-bezier(.2,.8,.2,1) both}
.bg .bar:nth-child(2){animation-delay:.15s}.bg .bar:nth-child(3){animation-delay:.3s}.bg .bar:nth-child(4){animation-delay:.45s}.bg .bar:nth-child(5){animation-delay:.6s}
.bg .arrow{stroke-dasharray:1200;stroke-dashoffset:1200;animation:draw 1.6s .5s ease-out forwards}
main{position:relative;z-index:1;width:100%;max-width:440px;margin:0 auto;padding:0 20px 32px;display:flex;flex-direction:column;align-items:center}
.string{width:3px;height:44px;background:linear-gradient(var(--sky),var(--pale))}
.tag{position:relative;transform-origin:50% 0;width:250px;padding:34px 18px 18px;background:var(--white);border-radius:28px;box-shadow:0 0 0 5px rgba(74,163,227,.4),0 26px 50px rgba(0,0,0,.45);animation:swing 2.4s ease-out both}
.tag::before{content:"";position:absolute;top:12px;left:50%;width:18px;height:18px;margin-left:-9px;border-radius:50%;background:var(--navy);box-shadow:inset 0 0 0 4px var(--sky)}
.tag img{display:block;width:100%;border-radius:12px}
h1{margin-top:26px;font-size:2rem;font-weight:700;letter-spacing:.02em;background:linear-gradient(90deg,#fff,#BFE0FA);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{margin-top:8px;color:#C5DCF8;font-size:1rem;text-align:center;line-height:1.7}
.links{margin-top:28px;width:100%;display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
a{color:inherit;text-decoration:none}
a:focus-visible{outline:3px solid var(--sky);outline-offset:3px}
.cta{grid-column:1/-1;display:flex;align-items:center;gap:14px;padding:12px 14px;border-radius:22px;background:linear-gradient(100deg,var(--sky),var(--royal));box-shadow:0 12px 30px rgba(74,163,227,.45),inset 0 1px 0 rgba(255,255,255,.35);font-weight:700;font-size:1.15rem;animation:pulse 2.6s 2s ease-in-out infinite}
.cta .ic{background:var(--white);border-radius:14px}
.cta .ic svg{stroke:var(--royal)}
.cta .t{flex:1}
.cta small{display:block;font-weight:400;font-size:.8rem;opacity:.9;margin-top:2px}
.cta .go{width:22px;height:22px;stroke:#fff;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;flex:none}
.soc{display:flex;flex-direction:column;align-items:center;gap:10px;padding:18px 8px 14px;border-radius:22px;background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.2);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);font-weight:600;font-size:.95rem;transition:transform .18s,background .18s,border-color .18s}
.soc:hover{transform:translateY(-4px);background:rgba(74,163,227,.25);border-color:var(--sky)}
.ic{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;flex:none}
.soc .ic{background:linear-gradient(145deg,var(--sky),var(--royal))}
.ic svg{width:26px;height:26px;fill:none;stroke:#fff;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ic svg .f{fill:#fff;stroke:none}
footer{margin-top:30px;color:#8FB0E3;font-size:.82rem}
@keyframes swing{0%{opacity:0;transform:translateY(-30px) rotate(9deg)}30%{opacity:1;transform:rotate(-6deg)}55%{transform:rotate(3.5deg)}78%{transform:rotate(-1.5deg)}100%{transform:rotate(0)}}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes pulse{50%{box-shadow:0 14px 40px rgba(74,163,227,.7),inset 0 1px 0 rgba(255,255,255,.35)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.bg .arrow{stroke-dashoffset:0}}
</style>
</head>
